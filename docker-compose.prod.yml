version: '3.8'

services:
  # Base de datos MariaDB - Producción
  mariadb:
    image: mariadb:latest
    container_name: pern_mariadb_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 10s
    networks:
      - pern_network_prod
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --max_allowed_packet=256M

  # Backend (Node.js + Express) - Producción
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: pern_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 5000
    expose:
      - "5000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pern_network_prod
    restart: unless-stopped

  # Frontend (React + Nginx) - Producción
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: pern_frontend_prod
    restart: always
    environment:
      REACT_APP_API_URL: ${API_URL}
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
    networks:
      - pern_network_prod
    restart: unless-stopped

volumes:
  mariadb_prod_data:
    driver: local

networks:
  pern_network_prod:
    driver: bridge
