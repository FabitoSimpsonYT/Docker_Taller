version: '3.8'

services:
  # Base de datos MariaDB
  mariadb:
    image: mariadb:latest
    container_name: pern_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pern_db
      MYSQL_USER: pern_user
      MYSQL_PASSWORD: pern_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d  # Para scripts SQL de inicialización
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - pern_network
    restart: unless-stopped

  # Backend (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: pern_backend
    environment:
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: pern_db
      DB_USER: pern_user
      DB_PASSWORD: pern_password
      API_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - pern_network
    restart: unless-stopped
    command: npm start

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: pern_frontend
    environment:
      REACT_APP_API_URL: http://backend:5000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pern_network
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  pern_network:
    driver: bridge
