version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: ${POSTGRES_CONTAINER_NAME:-pern_postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pern_db}
      POSTGRES_USER: ${POSTGRES_USER:-pern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pern_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pern_user} -d ${POSTGRES_DB:-pern_db}"]
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - pern_network
    restart: unless-stopped

  # Backend (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: ${BACKEND_CONTAINER_NAME:-pern_backend}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pern_db}
      DB_USER: ${DB_USER:-pern_user}
      DB_PASSWORD: ${DB_PASSWORD:-pern_password}
      API_PORT: ${API_PORT:-5000}
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - pern_network
    restart: unless-stopped
    command: npm start

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: ${FRONTEND_CONTAINER_NAME:-pern_frontend}
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://backend:5000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - pern_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pern_network:
    driver: bridge
